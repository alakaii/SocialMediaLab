name = "social-media-lab"
client_id = "45a73e3c9a49c248c9f5fad51cf42662"
application_url = "https://socialmedialab-production.up.railway.app"
embedded = true

[access_scopes]
scopes = "read_files,write_files,read_products,read_content"

[auth]
redirect_urls = [
  "https://socialmedialab-production.up.railway.app/auth/callback",
  "https://socialmedialab-production.up.railway.app/auth/shopify/callback",
  "https://socialmedialab-production.up.railway.app/shopify/auth/callback"
]

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  # Mandatory compliance webhooks. These cannot be registered through the Admin
  # API, so they only exist here; the handler lives at app/routes/webhooks.compliance.ts
  # and dispatches on the topic header.
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/compliance"

[pos]
embedded = false
